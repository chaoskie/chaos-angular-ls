name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the Angular language server
        run: npm install -g --ignore-scripts @angular/language-server@22.2.4
      - name: Install the fixture project
        run: npm ci --ignore-scripts
        working-directory: test/fixture
      - name: Check the manifests
        run: node test/validate-manifests.mjs
      - name: LSP smoke test
        run: node test/lsp-smoke.mjs
